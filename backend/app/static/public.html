<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درع · هل هذا الرابط رسمي؟</title>
<meta name="description" content="Check if a link is an official UAE website before you open it. تحقق من الرابط قبل أن تفتحه.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#16213a; --line:#22304d; --ink:#e8edf6; --mute:#8b99b5;
    --gold:#c9a24b; --red:#e5534b; --red-soft:rgba(229,83,75,.13); --amber:#d9a03f; --amber-soft:rgba(217,160,63,.13);
    --green:#3fb37f; --green-soft:rgba(63,179,127,.13); --grey-soft:rgba(139,153,181,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:16px/1.6 "IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif}
  html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
  .brand svg{width:30px;height:30px;flex:none}
  .brand .ar{color:var(--gold)}
  .lang{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
  .lang:hover{border-color:var(--gold)}
  .hero{padding:34px 0 10px;text-align:center}
  .hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.25}
  .hero p{margin:0 auto;color:var(--mute);max-width:560px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:26px}
  .row{display:flex;gap:10px}
  input{flex:1;min-width:0;font:inherit;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:var(--gold)}
  button.primary{font:inherit;font-weight:600;background:var(--gold);color:#1a1405;border:none;border-radius:10px;padding:0 22px;cursor:pointer;white-space:nowrap}
  button.primary:disabled{opacity:.6;cursor:default}
  .hint{color:var(--mute);font-size:13px;margin-top:10px}
  .result{display:none;margin-top:18px;border-radius:14px;padding:18px;border:1px solid}
  .result.high{background:var(--red-soft);border-color:rgba(229,83,75,.45)}
  .result.mid{background:var(--amber-soft);border-color:rgba(217,160,63,.45)}
  .result.ok{background:var(--green-soft);border-color:rgba(63,179,127,.45)}
  .result.none{background:var(--grey-soft);border-color:var(--line)}
  .result h2{margin:0;font-size:21px}
  .result .dom{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:14px;color:var(--mute);direction:ltr;unicode-bidi:isolate;word-break:break-all;margin-top:4px}
  .result h3{margin:14px 0 4px;font-size:13px;color:var(--mute);font-weight:600}
  .result ul{margin:0;padding-inline-start:20px}
  .result li{margin:3px 0}
  .official{margin-top:12px;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px;font-size:15px}
  .official a{color:var(--gold);font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
  .advice{margin-top:14px;font-weight:500}
  .actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .ghost{font:inherit;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
  .ghost:hover{border-color:var(--gold)}
  .small{font-size:13px;color:var(--mute)}
  .tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}
  .tip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .tip b{display:block;margin-bottom:4px}
  .tip span{color:var(--mute);font-size:14px}
  footer{border-top:1px solid var(--line);margin-top:20px;padding:18px 0 30px;color:var(--mute);font-size:13px}
  .err{color:var(--red);margin-top:10px;display:none}
  @media (max-width:640px){ .tips{grid-template-columns:1fr} .row{flex-direction:column} button.primary{padding:13px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3l11 4v8c0 7-4.7 12-11 14C9.7 27 5 22 5 15V7l11-4z" stroke="#c9a24b" stroke-width="2"/><path d="M11 16l3.5 3.5L21.5 12" stroke="#c9a24b" stroke-width="2" stroke-linecap="round"/></svg>
      <span><span class="ar">درع</span> · Shield</span>
    </div>
    <button class="lang" id="langBtn" onclick="toggleLang()">English</button>
  </header>

  <section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
  </section>

  <section class="box">
    <div class="row">
      <input id="link" autocomplete="off" spellcheck="false" placeholder="https://..." onkeydown="if(event.key==='Enter')check()">
      <button class="primary" id="checkBtn" onclick="check()" data-t="check"></button>
    </div>
    <div class="hint" data-t="hint"></div>
    <div class="err" id="err"></div>
    <div class="result" id="result" aria-live="polite"></div>
  </section>

  <section class="tips">
    <div class="tip"><b data-t="tip1h"></b><span data-t="tip1"></span></div>
    <div class="tip"><b data-t="tip2h"></b><span data-t="tip2"></span></div>
    <div class="tip"><b data-t="tip3h"></b><span data-t="tip3"></span></div>
  </section>

  <footer>
    <div data-t="privacy"></div>
    <div style="margin-top:6px" data-t="footer"></div>
  </footer>
</div>

<script>
const T = {
  ar: {
    title: "هل هذا الرابط رسمي؟",
    subtitle: "وصلتك رسالة عن مخالفة أو شحنة أو تحديث بيانات؟ الصق الرابط هنا قبل أن تفتحه، وسيخبرك درع إن كان يحمل علامات احتيال.",
    check: "افحص", hint: "درع لا يفتح الرابط أبداً، بل يفحصه من الخارج فقط.",
    tip1h: "لا تشارك رمز التحقق", tip1: "الجهات الرسمية لا تطلب منك أبداً رمز OTP أو بيانات بطاقتك عبر رابط.",
    tip2h: "استخدم التطبيق الرسمي", tip2: "لدفع المخالفات أو رسوم سالك أو تتبع الشحنات، افتح التطبيق الرسمي أو اكتب العنوان بنفسك.",
    tip3h: "انتبه للاستعجال", tip3: "عبارات مثل «ادفع خلال 24 ساعة» أو «سيتم إيقاف حسابك» من أشهر علامات الاحتيال.",
    privacy: "الخصوصية: لا نحفظ فحصك إلا إذا ضغطت «أبلغ المحللين». لا نطلب ولا نحفظ اسمك أو رقم هاتفك.",
    footer: "درع نموذج أولي لهاكاثون الإمارات 2026 من فريق آيدا. النتائج إرشادية وليست ضماناً.",
    lang: "English", checking: "جارٍ الفحص…", looks: "يبدو مثل:", officialSite: "الموقع الرسمي:",
    facts: "حقائق", rules: "قواعد", signs: "علامات تحذيرية متعلَّمة", notes: "ملاحظات أخرى",
    report: "أبلغ المحللين", reported: "شكراً، أُرسل الرابط للمحللين دون أي بيانات شخصية.", score: "درجة الخطر",
    v: {"official":"✓ موقع رسمي موثّق", "high risk":"⚠ خطر مرتفع", "suspicious":"مشبوه، كن حذراً",
        "unknown":"غير معروف، لا يمكن التحقق", "no warning signs":"لا توجد علامات تحذيرية"},
    empty: "الصق رابطاً أولاً.",
  },
  en: {
    title: "Is this link official?",
    subtitle: "Got a message about a fine, a parcel or updating your details? Paste the link here before you open it, and Shield will tell you if it shows signs of a scam.",
    check: "Check", hint: "Shield never opens the link. It only examines it from the outside.",
    tip1h: "Never share your OTP", tip1: "Official entities never ask for an OTP code or card details through a link.",
    tip2h: "Use the official app", tip2: "To pay fines, Salik fees or track parcels, open the official app or type the address yourself.",
    tip3h: "Watch for urgency", tip3: "\"Pay within 24 hours\" or \"your account will be suspended\" are classic scam signs.",
    privacy: "Privacy: your check is not saved unless you press \"Report to analysts\". We never ask for or store your name or phone number.",
    footer: "Shield is a UAE Hackathon 2026 prototype by team AIDA. Results are guidance, not a guarantee.",
    lang: "العربية", checking: "Checking…", looks: "Looks like:", officialSite: "Official website:",
    facts: "Facts", rules: "Rules", signs: "Learned warning signs", notes: "Other observations",
    report: "Report to analysts", reported: "Thanks, the link was sent to the analysts with no personal data.", score: "risk score",
    v: {"official":"✓ Verified official website", "high risk":"⚠ High risk", "suspicious":"Suspicious — be careful",
        "unknown":"Unknown — can't verify", "no warning signs":"No warning signs found"},
    empty: "Paste a link first.",
  }
};
let lang = "ar", last = null;
try { const s = localStorage.getItem("shield-lang"); if (s === "en" || s === "ar") lang = s; } catch (e) {}

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

function applyLang(){
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = (lang === "ar" ? "درع · " : "Shield · ") + t.title;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t[n.dataset.t]);
  $("langBtn").textContent = t.lang;
  if (last) render(last);
}
function toggleLang(){ lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("shield-lang", lang); } catch (e) {} applyLang(); }

function render(r){
  const t = T[lang], L = r[lang], box = $("result");
  const cls = {"official":"ok","high risk":"high","suspicious":"mid"}[r.verdict] || "none";
  box.className = "result " + cls; box.style.display = "block";
  const title = t.v[r.verdict] + ((r.score !== null && r.score !== undefined && r.verdict !== "official") ? " · " + t.score + " " + r.score + "/100" : "");
  const kids = [el("h2", "", title), el("div", "dom", r.domain || r.url)];
  const brand = lang === "ar" ? r.brand_ar : r.brand;
  if (r.official_sites && r.official_sites.length) {
    const o = el("div", "official");
    if (r.verdict !== "official") o.append(el("span", "", t.looks + " " + brand + " — "));
    o.append(el("span", "", t.officialSite + " "));
    r.official_sites.forEach((d, i) => { const a = el("a", "", d); a.href = "https://" + d; a.target = "_blank"; a.rel = "noopener noreferrer"; if (i) o.append(", "); o.append(a); });
    kids.push(o);
  }
  const section = (name, items) => { if (items && items.length) { kids.push(el("h3", "", name)); const ul = el("ul"); items.forEach(x => ul.append(el("li", "", x))); kids.push(ul); } };
  section(t.facts, L.facts); section(t.rules, L.rules); section(t.signs, L.signals); section(t.notes, L.notes);
  if (L.advice) kids.push(el("div", "advice", L.advice));
  if (r.verdict !== "official") {
    const act = el("div", "actions"); const b = el("button", "ghost", t.report); const msg = el("span", "small");
    b.onclick = async () => { b.disabled = true;
      try { await post("/api/report", {url: r.url}); msg.textContent = t.reported; } catch (e) { msg.textContent = e.message; b.disabled = false; } };
    act.append(b, msg); kids.push(act);
  }
  box.replaceChildren(...kids);
}

async function post(path, body){
  const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.detail || res.statusText);
  return j;
}

async function check(){
  const v = $("link").value.trim(), t = T[lang], err = $("err");
  err.style.display = "none";
  if (!v) { err.textContent = t.empty; err.style.display = "block"; return; }
  $("checkBtn").disabled = true; $("checkBtn").textContent = t.checking;
  try { last = await post("/api/check", {url: v}); render(last); }
  catch (e) { err.textContent = e.message; err.style.display = "block"; }
  finally { $("checkBtn").disabled = false; $("checkBtn").textContent = t.check; }
}
applyLang();
</script>
</body>
</html>
